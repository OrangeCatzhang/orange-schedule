<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:"><title>橙子日程 · 提醒</title><link rel="stylesheet" href="style.css"></head>
<body class="reminder-window">
<header class="reminder-heading"><span>日程提醒</span><span id="quote-count"></span></header>
<section class="reminder-quote" aria-label="名言与诗句"><h1 id="quote-text">学而时习之，不亦说乎？</h1><div class="reminder-quote-bottom"><cite id="quote-source"></cite><button class="text-button" id="quote-next" aria-label="换一句名句">换一句 ↻</button></div></section>
<p class="error-message" id="reminder-error" role="alert"></p>
<div id="reminders" class="reminder-list" aria-label="待处理提醒"></div>
<footer class="reminder-footer"><button class="text-button" id="open-main">打开计划日历 ↗</button></footer>
<script src="reminder.js"></script></body></html>
