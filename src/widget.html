<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:"><title>周光 · 桌面便签</title><link rel="stylesheet" href="widget.css"></head><body><section class="widget" data-theme="sage">
<header class="widget-chrome"><div class="widget-brand"><img src="assets/icon.png" alt="">周光 <span>桌面便签</span></div><div class="chrome-actions"><button id="widget-pin" class="icon-button" aria-label="置顶便签" aria-pressed="false" title="置顶便签"><svg viewBox="0 0 24 24"><path d="m8 3 8 0-1 7 3 4H6l3-4zM12 14v7"/></svg></button><button id="widget-preferences" class="icon-button" aria-label="便签外观" title="便签外观">⋯</button><button id="widget-close" class="icon-button" aria-label="关闭便签" title="关闭便签">×</button></div></header>
<div class="widget-hero"><div><div class="eyebrow" id="widget-eyebrow">把重要的事，留在眼前</div><h1 id="widget-title">今天的计划</h1><p id="widget-range"></p></div><div class="progress-ring"><div><strong id="progress-number">0</strong><span>待办</span></div></div></div>
<div id="preferences" class="preferences" hidden><div><span>便签颜色</span><div class="swatches"><button data-theme="sage" title="鼠尾草绿" aria-label="鼠尾草绿"></button><button data-theme="cream" title="暖米色" aria-label="暖米色"></button><button data-theme="lavender" title="浅紫色" aria-label="浅紫色"></button></div></div><label><input id="show-completed" type="checkbox" checked>显示已办清单</label><p>默认位于其他窗口下方，置顶后保持在最前。<br>拖动顶部移动 · 拖动边缘调整大小</p></div>
<div class="widget-controls"><div class="segmented"><button data-mode="day" class="active">日</button><button data-mode="week">周</button></div><div class="date-controls"><button id="widget-prev" class="icon-button" aria-label="上一日或周">‹</button><button id="widget-today" class="today-button">今天</button><button id="widget-next" class="icon-button" aria-label="下一日或周">›</button></div><select id="widget-category" aria-label="筛选分类"><option value="all">全部分类</option><option value="work">工作</option><option value="study">学习</option><option value="life">生活</option></select></div>
<div class="date-jump"><label for="widget-date">查看日期</label><input type="date" id="widget-date" aria-label="查看日期"><span id="follow-indicator">跟随今天</span></div>
<div class="task-scroll"><section class="task-section"><div class="section-head"><h2>待办 <span id="pending-count">0</span></h2><span class="section-note">一步一步来</span></div><div id="pending-list"></div></section><section class="task-section done-section" id="done-section"><button class="section-head completed-head" id="toggle-done" aria-expanded="true"><h2>已办 <span id="done-count">0</span></h2><span id="done-chevron">⌄</span></button><div id="done-list"></div></section></div>
<form id="quick-form"><div class="quick-title"><input name="title" maxlength="160" placeholder="＋ 添加一件要做的事" aria-label="新计划名称" required><button type="submit" id="quick-submit" aria-label="添加计划" title="添加计划">↵</button></div><div class="quick-options"><input type="date" name="date" aria-label="新计划日期" required><input type="time" name="time" aria-label="新计划时间" required><select name="reminder" aria-label="新计划提醒"><option value="-1">不提醒</option><option value="0">开始时</option><option value="10">提前10分钟</option></select></div><p id="quick-error" role="alert"></p></form>
<footer class="widget-footer"><span><i></i>与日历同步</span><button id="widget-open-main">打开计划日历 ↗</button></footer><div id="widget-toast" role="status"></div>
</section><script src="widget-model.cjs"></script><script src="widget.js"></script></body></html>
